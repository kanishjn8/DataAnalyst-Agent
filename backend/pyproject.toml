[project]
name = "data-analysis-api"
version = "1.0.0"
description = "CSV analysis backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "google-genai>=1.0,<3",
  "python-dotenv>=1.0,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "duckdb>=1.4,<2",
  "sqlglot>=28,<31",
  "pyjwt>=2.10,<3",
  "httpx>=0.28,<1",
  "redis>=6,<9",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
