events {}
http {
  access_log off;
  map $http_origin $cors_origin {
    default "";
    "http://127.0.0.1:3000" $http_origin;
    "http://localhost:3000" $http_origin;
  }
  server {
    listen 8000;
    client_max_body_size 15m;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'authorization, apikey, content-type, x-client-info, x-supabase-api-version, x-upsert, cache-control' always;
    add_header Access-Control-Expose-Headers 'ETag, Content-Type' always;
    add_header Vary Origin always;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    if ($request_method = OPTIONS) { return 204; }
    location /auth/v1/ { proxy_pass http://auth:9999/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /storage/v1/ { proxy_pass http://storage:5000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_request_buffering off; }
    location = /health { return 200 'ok'; }
  }
}
